plugins {
	id 'java'
	id 'org.springframework.boot' version '3.5.14'
	id 'io.spring.dependency-management' version '1.1.7'
}

group = 'com.human'
version = '0.0.1-SNAPSHOT'

java {
	toolchain {
		languageVersion = JavaLanguageVersion.of(17)
	}
}

repositories {
	mavenCentral()
}

// 의존성 설정
// 이 프로젝트는 여기 설정된 라이브러리를 의존한다.
dependencies {
	implementation 'org.springframework.boot:spring-boot-starter-thymeleaf'
	implementation 'org.springframework.boot:spring-boot-starter-web'
	testImplementation 'org.springframework.boot:spring-boot-starter-test'
	testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
	compileOnly 'org.projectlombok:lombok'
    annotationProcessor 'org.projectlombok:lombok'

	// 이 프로젝트는 mariaDB를 의존 -> 라이브러리 필요
	// 다음과 같이 적어주면 라이브러리를 자동으로 다운로드 해 준다.
	runtimeOnly 'org.mariadb.jdbc:mariadb-java-client'

	// 스프링에서는 무식하게 DAO를 만들지 않는다.
	// 사용하지 편하게 만들어놓은 프레임워크가 있다. 
	// 그 중 mybatis를 사용한다.
	// DAO가 아닌 mybatis를 사용해서 데이터 CRUD를 하겠다
	implementation 'org.mybatis.spring.boot:mybatis-spring-boot-starter:3.0.4'

	// 한 줄로 정리하면 마리아디비랑 마이바티스 의존성을 설정
}

tasks.named('test') {
	useJUnitPlatform()
}

// 이 파일은 빌드라는 의미를 이해해야 함
// 빌드라는 단어는 라이브러리 관리, 컴파일, 배포, 실행 등의 작업을 포함.
