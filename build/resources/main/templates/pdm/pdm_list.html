<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <title>상품 관리</title>

    <link rel="stylesheet" th:href="@{/css/common.css}">
    <link rel="stylesheet" th:href="@{/css/pdm/pdm_list.css}"> 
</head>

<body>

    <div th:replace="layout/header :: headerFragment"></div>

    <div class="container">

        <div class="top-area">
            <h2>상품 관리</h2>
        </div>
        <div class="btn-box">
            <button class="write-btn" onclick="location.href='/pdm/write'">상품 등록</button>
        </div>

        <table>

            <thead>
                <tr>
                    <th style="width: 8%;">번호</th>
                    <th style="width: 12%;">카테고리</th> 
                    <th style="width: 24%;">상품명</th>
                    <th style="width: 12%;">상품가격</th>
                    <th style="width: 10%;">상품재고</th>
                    <th style="width: 10%;">판매상태</th> 
                    <th style="width: 12%;">등록일</th>
                    <th style="width: 12%;">관리</th>
                </tr>
            </thead>

            <tbody>
                <tr th:each="product : ${products}">
                    <td th:text="${product.id}">상품번호</td>
                    <td th:text="${product.category}">카테고리</td> 
                    <td>
                        <a th:href="@{/pdm/{id}(id=${product.id})}" th:text="${product.name}">상품명</a>
                    </td>                    
                    <td th:text="${#numbers.formatInteger(product.price, 3, 'COMMA')}">가격</td>
                    <td th:text="${product.stock}">재고 수량</td>
                    <td th:text="${product.status}">판매 상태</td> 
                    <td th:text="${#strings.replace(product.createdAt, 'T', ' ')}">등록일</td>
                    <td>
                        <button class="action-btn edit-btn" th:onclick="|location.href='/pdm/edit/${product.id}'|">
                            수정
                        </button>
                        <button class="action-btn delete-btn" th:onclick="|deleteProduct(${product.id})|">
                            삭제
                        </button>
                    </td>
                </tr>

            </tbody>
        </table>

        <div class="paging">

            <a href="#">이전</a>

            <a href="#" class="active">1</a>
            <a href="#">2</a>
            <a href="#">3</a>

            <a href="#">다음</a>

        </div>

    </div>

    <div th:replace="layout/footer :: footerFragment"></div>

    <script>

        function deleteProduct(id) {

            const result = confirm("상품을 삭제하시겠습니까?");

            if (result) {
                location.href = "/pdm/delete/" + id;
            }
        }

    </script>

</body>

</html>
