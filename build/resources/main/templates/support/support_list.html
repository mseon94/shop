<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>고객센터 - 문의 목록</title>
    
    <link rel="stylesheet" th:href="@{/css/common.css}">
    <link rel="stylesheet" th:href="@{/css/support.css}">
</head>
<body>

    <div th:replace="layout/header :: headerFragment"></div>
    <div class="container">
            <div class="top-area">
                <h2>문의 게시판</h2>
            </div>

        <div class="btn-box">
            <a th:href="@{/supports/write}"><button type="button">문의하기</button></a>
        </div>

        <table>
            <thead>
                <tr>
<tr>
                <th style="width: 8%;">번호</th>
                <th style="width: 43%;">제목</th>
                <th style="width: 15%;">작성자</th>
                <th style="width: 12%;">작성일</th>
                <th style="width: 10%;">답변여부</th>
                <th style="width: 12%;">관리</th>
            </tr>
            </thead>
            <tbody>
                <tr th:if="${#lists.isEmpty(supportList)}">
                    <td colspan="5">등록된 문의글이 없습니다.</td>
                </tr>
                
                <tr th:each="support : ${supportList}">
                    <td th:text="${support.id}">1</td>
                    <td th:text="${support.title}">제목</td>
                    <td th:text="${support.writer}">작성자</td>
                    <td th:text="${#strings.replace(support.createdAt, 'T', ' ')}">2026-05-28 12:00:00</td>
                    <td>
                        <span th:if="${support.completed == false}" class="status-badge waiting">답변미완</span>
                        <span th:if="${support.completed == ture}" class="status-badge complete">답변완료</span>
                    </td>                    
                    <td>
                        <button type="button">수정</button>
                        <a th:href="@{/supports/delete/{id}(id=${support.id})}" onclick="return confirm('정말 삭제하시겠습니까?');"><button type="button">삭제</button></a>
                    </td>
                </tr>
            </tbody>
        </table>

        <nav th:if="${totalPages > 0}">
            <ul class="pagination">
                <li th:classappend="${currentPage == 0} ? 'disabled'">
                    <a th:href="@{/supports(page=${currentPage - 1})}">&laquo; 이전</a>
                </li>

                <li th:each="pageIdx : ${#numbers.sequence(0, totalPages - 1)}" 
                    th:classappend="${pageIdx == currentPage} ? 'active'">
                    <a th:href="@{/supports(page=${pageIdx})}" th:text="${pageIdx + 1}">1</a>
                </li>

                <li th:classappend="${currentPage + 1 == totalPages} ? 'disabled'">
                    <a th:href="@{/supports(page=${currentPage + 1})}">다음 &raquo;</a>
                </li>
            </ul>
        </nav>

        </div>
        
        <div th:replace="layout/footer :: footerFragment"></div>

    </body>
</html>
