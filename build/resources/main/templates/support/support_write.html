<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>고객센터 - 문의하기</title>

    <link rel="stylesheet" th:href="@{/css/common.css}">
    <link rel="stylesheet" th:href="@{/css/support_write.css}">
</head>
<body>

    <div th:replace="layout/header :: headerFragment"></div>

    <div class="container">
        
        <div class="top-area">
            <h2>1:1 문의하기</h2>
        </div>

        <div class="form-container">
            <form th:action="@{/supports/write}" method="post" enctype="multipart/form-data">
                
                <div class="form-group">
                    <label for="writer">작성자</label>
                    <input type="text" id="writer" name="writer" placeholder="이름을 입력하세요. 미작성시 '사용자'로 표시됩니다">
                </div>

                <div class="form-group">
                    <label for="email">이메일</label>
                    <input type="email" id="email" name="email" placeholder="답변을 받을 이메일 주소">
                </div>

                <div class="form-group">
                    <label for="password">비밀번호</label>
                    <input type="password" id="password" name="password" required placeholder="글 수정/삭제 시 필요합니다">
                </div>

                <div class="form-group">
                    <label for="title">문의 제목</label>
                    <input type="text" id="title" name="title" required placeholder="제목을 입력하세요">
                </div>

                <div class="form-group">
                    <label for="content">문의 내용</label>
                    <textarea id="content" name="content" required placeholder="문의 내용을 상세히 작성해주세요"></textarea>
                </div>

                <div class="form-group">
                    <label for="attachedFile">첨부파일</label>
                    <input type="file" id="attachedFile" name="attachedFile">
                </div>

                <div class="form-btn-box">
                    <button type="submit">등록하기</button>
                    <a th:href="@{/supports}" class="btn-cancel">취소</a>
                </div>
            </form>
        </div>
        
    </div> <div th:replace="layout/footer :: footerFragment"></div>

</body>
</html>
