<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <title>게시글 작성</title>

    <link rel="stylesheet" th:href="@{/css/common.css}">
    <link rel="stylesheet" th:href="@{/css/support_write.css}">
</head>

<body>

    <div th:replace="layout/header :: headerFragment"></div>

    <div class="container">

        <div class="top-area">
            <h2>게시글 작성</h2>
        </div>

        <div class="form-container">
            <form id="boardForm" th:action="@{/boards}" method="post" enctype="multipart/form-data">

                <div class="form-group">
                    <label for="writer">작성자</label>
                    <input type="text" id="writer" name="writer" required placeholder="이름을 입력하세요">
                </div>

                <div class="form-group">
                    <label for="title">제목</label>
                    <input type="text" id="title" name="title" required placeholder="제목을 입력하세요">
                </div>

                <div class="form-group">
                    <label for="content">글내용</label>
                    <textarea id="content" name="content" required placeholder="내용을 입력하세요"></textarea>
                </div>

                <div class="form-group">
                    <label>첨부파일</label>
                    <div class="file-area" id="dropZone">
                        <p>파일을 드래그 하세요</p>
                        <p>또는</p>
                        <input type="file" id="fileInput" name="uploadFile" multiple accept="image/*" hidden>
                        <button type="button">
                            + 파일 추가
                        </button>
                    </div>

                    <div id="previewList" class="preview-list"></div>
                </div>

                <div class="form-btn-box">
                    <button type="submit" class="save-btn">저장하기</button>
                </div>

            </form>
        </div>

    </div>

    <div th:replace="layout/footer :: footerFragment"></div>

    <script>
        let selectedFiles = [];

        const fileInput = document.getElementById("fileInput");
        const dropZone = document.getElementById("dropZone");
        const previewList = document.getElementById("previewList");
        const boardForm = document.getElementById("boardForm");

        dropZone.addEventListener("click", (e) => {
            if (e.target.tagName !== "BUTTON") {
                fileInput.click();
            }
        });
        
        dropZone.querySelector("button").addEventListener("click", (e) => {
            e.stopPropagation();
            fileInput.click();
        });

        fileInput.addEventListener("change", function (e) {
            addFiles(e.target.files);
        });

        dropZone.addEventListener("dragover", function (e) {
            e.preventDefault();
            dropZone.classList.add("dragover");
        });

        dropZone.addEventListener("dragleave", function (e) {
            e.preventDefault();
            dropZone.classList.remove("dragover");
        });

        dropZone.addEventListener("drop", function (e) {
            e.preventDefault();
            dropZone.classList.remove("dragover");
            addFiles(e.dataTransfer.files);
        });

        function addFiles(files) {
            for (let file of files) {
                if (!file.type.startsWith("image/")) continue;
                selectedFiles.push(file);
            }
            syncInput();
            renderPreview();
        }

        function syncInput() {
            const dataTransfer = new DataTransfer();
            selectedFiles.forEach(file => {
                dataTransfer.items.add(file);
            });
            fileInput.files = dataTransfer.files;
        }

        function renderPreview() {
            previewList.innerHTML = "";
            selectedFiles.forEach((file, index) => {
                const imgUrl = URL.createObjectURL(file);
                const div = document.createElement("div");
                div.classList.add("preview-item");
                div.innerHTML = `
                    <img src="${imgUrl}">
                    <button type="button" class="remove-btn" onclick="removeFile(${index})">x</button>
                `;
                previewList.appendChild(div);
            });
        }

        function removeFile(index) {
            selectedFiles.splice(index, 1);
            syncInput();
            renderPreview();
        }

        boardForm.addEventListener("submit", function(e) {
            console.log("서버로 전송되는 파일 개수:", fileInput.files.length);
        });
    </script>

</body>
</html>
